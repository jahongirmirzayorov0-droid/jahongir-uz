name: Yangiliklarni yangilash

on:
  schedule:
    # Har 3 soatda (UTC). Toshkent vaqti bilan 05:00, 08:00, 11:00 ...
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: RSS lentalardan news.json yasash
        run: python3 scripts/update_news.py

      - name: O'zgargan bo'lsa commit qilish
        id: commit
        run: |
          if git diff --quiet -- news.json && git ls-files --error-unmatch news.json >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Yangiliklar avtomatik yangilandi"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Saytni qayta nashr qilish
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build so'rovi yuborilmadi"
