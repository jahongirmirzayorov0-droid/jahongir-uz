name: Milliy bank kurslarini yangilash

on:
  schedule:
    # Har soatda (UTC), ish vaqtida tez-tez o'zgaradigan kurslar uchun
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: bank.uz'dan NBU kurslarini olish
        run: python3 scripts/update_rates.py

      - name: O'zgargan bo'lsa commit qilish
        id: commit
        run: |
          if git diff --quiet -- nbu_rates.json && git ls-files --error-unmatch nbu_rates.json >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f nbu_rates.json ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nbu_rates.json
          git commit -m "Milliy bank kurslari avtomatik yangilandi"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Saytni qayta nashr qilish
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build so'rovi yuborilmadi"
